name: Build 保活专版 dylib

on:
  workflow_dispatch:
  push:
    branches: [ 'fubg-keepalive' ]

permissions:
  contents: write

jobs:
  build:
    name: Build SIOriginal.dylib (keep-alive only)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build dylib (pure clang)
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          mkdir -p artifacts
          clang -arch arm64 -dynamiclib -O2 \
            -install_name @rpath/SIOriginal.dylib \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -undefined dynamic_lookup -fobjc-arc \
            -framework Foundation -framework UIKit -framework AVFoundation -framework UserNotifications \
            -o artifacts/SIOriginal.dylib Tweak/SIOriginal.m
          codesign --force --sign - artifacts/SIOriginal.dylib
          lipo -info artifacts/SIOriginal.dylib
          file artifacts/SIOriginal.dylib
          shasum -a 256 artifacts/SIOriginal.dylib
          echo "dylib size: $(du -h artifacts/SIOriginal.dylib | cut -f1)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SIOriginal-keepalive-dylib
          path: artifacts/SIOriginal.dylib
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 保活专版 ${{ github.ref_name }}
          files: artifacts/SIOriginal.dylib
          generate_release_notes: true
